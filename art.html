  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #333;
      line-height: 1.6;
      background: #fafafa;
    }

    .gallery-header {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(135deg, #fff9f0 0%, #f0f9ff 30%, #fef5ff 70%, #f0fff4 100%);
    }

    .gallery-header h1 {
      font-size: 48px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .gallery-header p {
      font-size: 18px;
      color: #666;
      font-style: italic;
    }

    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 60px 40px 80px;
    }

    .gallery-grid {
      column-count: 4;
      column-gap: 20px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      z-index: 10;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .gallery-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 8px;
    }

    .gallery-item:hover::after {
      opacity: 1;
    }

    /* Responsive columns */
    @media (max-width: 1200px) {
      .gallery-grid {
        column-count: 3;
      }

      .gallery-container {
        padding: 50px 30px 70px;
      }
    }

    @media (max-width: 768px) {
      .gallery-header {
        padding: 40px 20px 30px;
      }

      .gallery-header h1 {
        font-size: clamp(32px, 7vw, 48px);
      }

      .gallery-grid {
        column-count: 2;
        column-gap: 15px;
      }

      .gallery-item {
        margin-bottom: 15px;
      }

      .gallery-container {
        padding: 40px 20px 60px;
      }
    }

    @media (max-width: 480px) {
      .gallery-grid {
        column-count: 1;
      }

      .gallery-item:hover {
        transform: scale(1.02);
      }
    }

    footer {
      background: #dee4d9;
      padding: 40px 50px;
      margin-top: 0;
    }

    .footer-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-style: italic;
      color: #666;
    }

    .footer-right {
      display: flex;
      gap: 30px;
    }

    .footer-right a {
      text-decoration: none;
      color: #333;
      transition: opacity 0.3s;
    }

    .footer-right a:hover {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      footer {
        padding: 30px 20px;
      }

      .footer-content {
        flex-direction: column;
        gap: 20px;
        text-align: center;
      }
    }
  </style>
